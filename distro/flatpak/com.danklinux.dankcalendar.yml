id: com.danklinux.dankcalendar
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: dcal

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/libSPIRV-Tools*
  - /bin/spirv-*
  - /share/applications/org.quickshell.desktop
  - /share/icons/hicolor/scalable/apps/org.quickshell.svg

build-options:
  env:
    GOTOOLCHAIN: local

modules:
  - name: cli11
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLI11_BUILD_DOCS=OFF
      - -DCLI11_BUILD_EXAMPLES=OFF
      - -DCLI11_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/CLIUtils/CLI11.git
        tag: v2.6.1
        commit: bfffd37e1f804ca4fae1caae106935791696b6a9

  - name: spirv-tools
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSPIRV_SKIP_TESTS=ON
      - -DSPIRV_WERROR=OFF
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Tools.git
        tag: v2026.2
        commit: 0539c81f69a3daeb706fd3477dca61435b475156
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        commit: ad9184e76a66b1001c29db9b0a3e87f646c64de0
        dest: external/spirv-headers

  - name: quickshell
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DDISTRIBUTOR=Dux Calendar Flatpak
      - -DUSE_JEMALLOC=OFF
      - -DCRASH_HANDLER=OFF
      - -DBUILD_TESTING=OFF
      - -DSOCKETS=ON
      - -DWAYLAND=ON
      - -DWAYLAND_WLR_LAYERSHELL=OFF
      - -DWAYLAND_SESSION_LOCK=OFF
      - -DWAYLAND_TOPLEVEL_MANAGEMENT=OFF
      - -DHYPRLAND=OFF
      - -DSCREENCOPY=OFF
      - -DX11=ON
      - -DI3=OFF
      - -DSERVICE_STATUS_NOTIFIER=OFF
      - -DSERVICE_PIPEWIRE=OFF
      - -DSERVICE_MPRIS=OFF
      - -DSERVICE_PAM=OFF
      - -DSERVICE_POLKIT=OFF
      - -DSERVICE_GREETD=OFF
      - -DSERVICE_UPOWER=OFF
      - -DSERVICE_NOTIFICATIONS=OFF
      - -DBLUETOOTH=OFF
      - -DNETWORK=OFF
    sources:
      - type: git
        url: https://github.com/quickshell-mirror/quickshell.git
        tag: v0.3.1
        commit: 1a4716cde794a59928d9d9fc15f2afc7a95de360
        disable-submodules: true

  - name: dankcalendar
    buildsystem: simple
    build-commands:
      - make -C core sync-shell
      - >-
        PATH=$PWD/go/bin:$PATH go build -C core -mod=vendor -tags withshell
        -ldflags=-s\ -w\ -X\ main.Version=2.1.1\ -X\ main.Commit=47bbc924
        -o dcal ./cmd/dcal
      - install -Dm755 core/dcal /app/bin/dcal
      - >-
        install -Dm644 assets/dev.duxlabs.calendar.desktop
        /app/share/applications/com.danklinux.dankcalendar.desktop
      - >-
        sed -i 's/^Icon=dev\.duxlabs\.calendar$/Icon=com.danklinux.dankcalendar/'
        /app/share/applications/com.danklinux.dankcalendar.desktop
      - >-
        install -Dm644 assets/dev.duxlabs.calendar.metainfo.xml
        /app/share/metainfo/com.danklinux.dankcalendar.metainfo.xml
      - >-
        sed -i -e '/<replaces>/,/<\/replaces>/d'
        -e '/<provides>/,/<\/provides>/{/<id>com\.danklinux\.dankcalendar<\/id>/d}'
        -e 's/dev\.duxlabs\.calendar/com.danklinux.dankcalendar/g'
        /app/share/metainfo/com.danklinux.dankcalendar.metainfo.xml
      - >-
        install -Dm644 assets/dev.duxlabs.calendar.svg
        /app/share/icons/hicolor/scalable/apps/com.danklinux.dankcalendar.svg
      - >-
        install -Dm644 LICENSE
        /app/share/licenses/com.danklinux.dankcalendar/LICENSE
    sources:
      - type: git
        url: https://github.com/duxlabs-dev/dux-calendar.git
        commit: 47bbc92492b3a1cd677906c4439e4b3d172b7b86
      - go.mod.yml
      - type: archive
        url: https://go.dev/dl/go1.27.3.linux-amd64.tar.gz
        sha256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
        dest: go
        only-arches:
          - x86_64
      - type: archive
        url: https://go.dev/dl/go1.27.3.linux-arm64.tar.gz
        sha256: a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49
        dest: go
        only-arches:
          - aarch64
