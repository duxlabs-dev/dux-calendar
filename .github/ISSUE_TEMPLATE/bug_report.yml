name: Bug Report
description: Crashes or unexpected behaviors
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## Dux Calendar Bug Report
        Limit your report to one issue per submission unless similarly related
  - type: dropdown
    id: compositor
    attributes:
      label: Compositor
      options:
        - Niri
        - Hyprland
        - MangoWC (dwl)
        - Sway
        - Other (specify below)
    validations:
      required: true
  - type: input
    id: compositor_other
    attributes:
      label: If Other, please specify
      placeholder: e.g., Wayfire, Mutter, etc.
    validations:
      required: false
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Arch Linux
        - CachyOS
        - Fedora
        - NixOS
        - Debian
        - Ubuntu
        - Gentoo
        - OpenSUSE
        - Other (specify below)
    validations:
      required: true
  - type: input
    id: distribution_other
    attributes:
      label: If Other, please specify
      placeholder: e.g., PikaOS, Void Linux, etc.
    validations:
      required: false
  - type: dropdown
    id: installation_method
    attributes:
      label: Select your Installation Method
      options:
        - Flatpak
        - Distro Packaging
        - Nix
        - Source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Output of `dcal version`
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Brief description of the issue
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior
    validations:
      required: false
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Please provide detailed steps to reproduce the issue
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Messages/Logs
      description: Please include any error messages, stack traces, or relevant logs
      placeholder: Paste error messages or logs here
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Recordings
      description: If applicable, add screenshots or screen recordings
      placeholder: Attach images or videos here
    validations:
      required: false
