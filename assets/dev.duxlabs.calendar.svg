<!-- calendar glyph after Material Symbols Rounded, Apache License 2.0, https://github.com/google/material-design-icons -->
<!-- Dux Calendar: lavender body with a 3px mid-tone rim just inside the outline. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="8" y1="9.33" x2="56" y2="58.67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F0FF"/>
      <stop offset="1" stop-color="#D0BCFF"/>
    </linearGradient>
    <!-- A mask, not a clip-path: QtSvg ignores clip-path. It keeps the inner half of the rim stroke. -->
    <mask id="inside" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="8" y="9.33" width="48" height="49.34" rx="5" fill="#fff"/>
    </mask>
  </defs>
  <g mask="url(#inside)">
    <rect x="8" y="9.33" width="48" height="49.34" rx="5" fill="url(#body)"/>
    <rect x="8" y="9.33" width="48" height="15.67" fill="#9F7AEA"/>
    <rect x="8" y="9.33" width="48" height="49.34" rx="5" fill="none" stroke="#9F7AEA" stroke-width="6"/>
  </g>
  <g fill="#6B4FB8">
    <rect x="16.33" y="4.67" width="4.67" height="9.33" rx="2.33"/>
    <rect x="43" y="4.67" width="4.67" height="9.33" rx="2.33"/>
  </g>
  <g fill="#9F7AEA">
    <circle cx="21.33" cy="34.67" r="2.67"/><circle cx="32" cy="34.67" r="2.67"/><circle cx="42.67" cy="34.67" r="2.67"/>
    <circle cx="21.33" cy="45.33" r="2.67"/><circle cx="42.67" cy="45.33" r="2.67"/>
  </g>
  <circle cx="32" cy="45.33" r="2.67" fill="#6B4FB8"/>
</svg>
